# Local production-like stack: frontend, FastAPI, PostgreSQL 16.
#
# Database credentials come from the environment (see .env.example). The
# defaults below are for local development only — never reuse them in a
# real deployment.
#
# PostgreSQL is published on localhost only (127.0.0.1:5432) so host tools
# can connect. It is not advertised on all interfaces. Production hosts
# should use docker-compose.prod.yml, which does not publish 5432.

services:
  db:
    image: postgres:16-alpine
    container_name: telecom-churn-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-churn_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-churn_password}
      POSTGRES_DB: ${POSTGRES_DB:-telecom_churn}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - churn

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: telecom-churn-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.example
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-churn_user}:${POSTGRES_PASSWORD:-churn_password}@db:5432/${POSTGRES_DB:-telecom_churn}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080}
      PYTHONPATH: /workspace
      LLM_PROVIDER: none
      DB_SSLMODE: ${DB_SSLMODE:-}
    ports:
      - "8000:8000"
    volumes:
      # Whole repo so the backend can import `ml` and `agent`, and can see
      # locally trained joblib artifacts that are not copied into the image.
      - .:/workspace
    working_dir: /workspace/backend
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    networks:
      - churn
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ""
    container_name: telecom-churn-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - churn

volumes:
  postgres_data:

networks:
  churn:
    driver: bridge
